<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>اشتراک‌گذاری موقعیت مکانی</title>
<style>
body {
  font-family: sans-serif;
  background: #101827;
  color: white;
  text-align: center;
  padding: 25px;
}
.box {
  max-width: 450px;
  margin: 45px auto;
  padding: 25px;
  background: #1e293b;
  border-radius: 18px;
}
button {
  display: block;
  width: 100%;
  margin-top: 18px;
  padding: 15px;
  border: 0;
  border-radius: 10px;
  background: #38bdf8;
  color: #101827;
  font-size: 16px;
}
button:disabled {
  opacity: .4;
}
.result {
  background: #0f172a;
  padding: 15px;
  border-radius: 10px;
  margin-top: 20px;
  direction: ltr;
  overflow-wrap: anywhere;
}
</style>
</head>
<body>
<div class="box">
  <h2>اشتراک‌گذاری موقعیت مکانی</h2>
  <p>
    با انتخاب دکمهٔ زیر، مرورگر اجازهٔ دسترسی به
    موقعیت مکانی شما را درخواست می‌کند.
    مختصات فقط پس از تأیید شما نمایش داده می‌شود.
  </p>

  <button id="get">دریافت موقعیت مکانی من</button>

  <div id="result" class="result">
    هنوز موقعیتی دریافت نشده است.
  </div>

  <button id="share" disabled>
    اشتراک‌گذاری موقعیت
  </button>

  <p id="message"></p>
</div>

<script>
let locationText = "";

const getButton = document.getElementById("get");
const shareButton = document.getElementById("share");
const result = document.getElementById("result");
const message = document.getElementById("message");

getButton.onclick = () => {
  if (!navigator.geolocation) {
    message.textContent = "مرورگر شما از موقعیت مکانی پشتیبانی نمی‌کند.";
    return;
  }

  message.textContent = "در حال دریافت موقعیت...";

  navigator.geolocation.getCurrentPosition(
    (position) => {
      const lat = position.coords.latitude;
      const lon = position.coords.longitude;

      locationText =
        "عرض جغرافیایی: " + lat +
        "\nطول جغرافیایی: " + lon;

      result.textContent = locationText;
      shareButton.disabled = false;
      message.textContent = "موقعیت با موفقیت دریافت شد.";
    },
    () => {
      message.textContent =
        "دسترسی داده نشد یا دریافت موقعیت ناموفق بود.";
    },
    { enableHighAccuracy: true, timeout: 15000 }
  );
};

shareButton.onclick = async () => {
  if (!locationText) return;

  if (!navigator.share) {
    message.textContent =
      "اشتراک‌گذاری مستقیم در این مرورگر پشتیبانی نمی‌شود.";
    return;
  }

  try {
    await navigator.share({
      title: "موقعیت مکانی من",
      text: locationText
    });
  } catch (error) {
    if (error.name !== "AbortError") {
      message.textContent = "اشتراک‌گذاری انجام نشد.";
    }
  }
};
</script>
</body>
</html>
